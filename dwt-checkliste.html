<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWT – Exercise Tracker</title>
<style>
  :root{
    --paper:#EAEEF3;
    --card:#FFFFFF;
    --ink:#0E1726;
    --muted:#6B7A90;
    --line:#D3DAE4;
    --t:#3070B3;
    --p:#B0812A;
    --done:#0E7C6B;
    --done-bg:#E4F2EF;
    --skip:#96702A;
    --skip-bg:#F6F1E6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(to right, rgba(48,112,179,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(48,112,179,.07) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--ink);
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.45;padding:28px 18px 64px;
  }
  .wrap{max-width:980px;margin:0 auto}

  header{margin-bottom:26px}
  .eyebrow{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;
     line-height:1.1;margin:0 0 2px;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--t)}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}

  .meter{
    background:var(--card);border:1px solid var(--line);border-radius:3px 3px 0 0;
    padding:14px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  }
  .count{font-family:Georgia,serif;font-size:26px;line-height:1;white-space:nowrap}
  .count small{font-size:14px;color:var(--muted);font-family:inherit}
  .bar{flex:1 1 200px;height:6px;background:#E6EAF0;border-radius:99px;overflow:hidden;
       min-width:140px;display:flex}
  .bar i{display:block;height:100%;width:0;transition:width .35s ease}
  #fill{background:var(--done)}
  #fillSkip{background:var(--skip);opacity:.5}
  .split{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .split b{color:var(--ink);font-weight:600}

  .bank{
    background:#F7F9FB;border:1px solid var(--line);border-top:none;border-radius:0 0 3px 3px;
    padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;
  }
  .state{display:flex;align-items:center;gap:7px;color:var(--muted)}
  .state .dot{width:8px;height:8px;border-radius:99px;background:var(--muted)}
  .state.ok .dot{background:var(--done)}
  .state.ok{color:var(--done)}
  .state.warn .dot{background:var(--p)}
  .state.warn{color:#8A6520}
  #code{
    flex:1 1 150px;min-width:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);
  }
  .mini{
    background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12.5px;
    padding:5px 11px;border-radius:3px;cursor:pointer;white-space:nowrap;
  }
  .mini:hover{border-color:var(--muted);color:var(--ink)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:16px 2px 4px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .hint{font-size:12.5px;color:var(--muted);margin:0 2px 12px;line-height:1.6}
  .hint b{font-weight:600;color:var(--ink)}

  .matrix{position:relative;padding:0 22px}
  .matrix::before,.matrix::after{
    content:"";position:absolute;top:0;bottom:0;width:12px;border:2px solid var(--ink);opacity:.55;
  }
  .matrix::before{left:0;border-right:none}
  .matrix::after{right:0;border-left:none}

  .blatt{background:var(--card);border:1px solid var(--line);border-radius:3px;
         padding:12px 14px 14px;margin-bottom:10px}
  .bhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .bnum{font-family:Georgia,serif;font-size:17px}
  .bdate{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .bcount{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
  .blatt.full .bcount{color:var(--done)}

  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
  .cell{
    display:grid;grid-template-columns:1fr auto;align-items:stretch;
    background:#FBFCFD;border:1px solid var(--line);border-left:3px solid var(--type);
    border-radius:2px;overflow:hidden;transition:background .15s,border-color .15s;
  }
  .main{
    display:flex;align-items:flex-start;gap:9px;text-align:left;background:none;border:none;
    padding:8px 6px 8px 10px;font:inherit;color:inherit;cursor:pointer;min-width:0;
  }
  .main:hover{background:rgba(48,112,179,.05)}
  .tools{display:flex;border-left:1px solid var(--line)}
  .tool{
    background:none;border:none;color:#B6BFCC;font-size:13px;line-height:1;padding:0 8px;
    cursor:pointer;transition:color .15s,background .15s;
  }
  .tool + .tool{border-left:1px solid var(--line)}
  .tool:hover{background:rgba(14,23,38,.05);color:var(--ink)}
  .main:focus-visible,.tool:focus-visible{outline:2px solid var(--t);outline-offset:-2px}
  .cell.hasnote .tnote{color:var(--t)}
  .cell.skipped .tskip{color:var(--skip)}

  .box{flex:none;width:15px;height:15px;margin-top:2px;border:1.5px solid var(--line);
       border-radius:2px;background:#fff;position:relative}
  .txt{min-width:0}
  .code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
        letter-spacing:.06em;color:var(--type);font-weight:600}
  .name{display:block;font-size:13px;line-height:1.3;margin-top:1px}

  .note{
    grid-column:1 / -1;display:none;width:100%;border:none;border-top:1px dashed var(--line);
    background:#F6F9FC;font:inherit;font-size:12.5px;color:#3F4B5C;padding:6px 10px;resize:vertical;
    min-height:32px;font-family:inherit;
  }
  .note::placeholder{color:#A9B4C2}
  .note:focus{outline:none;background:#EEF4FA}
  .cell.noting .note{display:block}

  .cell.done{background:var(--done-bg);border-color:#BFE0D9;border-left-color:var(--done)}
  .cell.done .box{background:var(--done);border-color:var(--done)}
  .cell.done .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .cell.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .cell.done .note{background:#EDF6F4;border-top-color:#C9E3DD}

  .cell.skipped{background:var(--skip-bg);border-color:#E2D5B7;border-left-style:dashed;
                border-left-color:var(--skip)}
  .cell.skipped .box{border-color:var(--skip);border-style:dashed;background:#fff}
  .cell.skipped .box::after{content:"";position:absolute;left:1px;top:5px;width:9px;height:1.5px;
    background:var(--skip)}
  .cell.skipped .name{color:#8A7748;font-style:italic}
  .cell.skipped .note{background:#FBF7EC;border-top-color:#E2D5B7;color:#6B5A32}

  footer{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}

  @media (max-width:520px){
    body{padding:20px 12px 48px}
    h1{font-size:26px}
    .matrix{padding:0 14px}
    .matrix::before,.matrix::after{width:8px}
    .cells{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    body{background:#fff;padding:0}
    .bank,.mini,.tools{display:none}
    .blatt{break-inside:avoid}
    .cell.hasnote .note{display:block!important;border-top:1px solid #ddd}
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">TUM · SoSe 2026 · Kilbertus</div>
    <h1>Discrete <em>Probability Theory</em></h1>
    <div class="sub">Sheet 0 to 11 · "DPT Exercises"</div>

    <div class="meter">
      <div class="count"><span id="done">0</span><small> / 54 completed</small></div>
      <div class="bar"><i id="fill"></i><i id="fillSkip"></i></div>
      <div class="split">
        <span>Exercises <b id="ce">0/49</b></span>
        <span>Bonus <b id="cb">0/5</b></span>
        <span>done <b id="cd">0</b></span>
        <span>skipped <b id="cs">0</b></span>
      </div>
    </div>

    <div class="bank">
      <span class="state" id="state"><i class="dot"></i><span id="stateTxt">Checking storage …</span></span>
      <input id="code" spellcheck="false" aria-label="Save code">
      <button class="mini" id="btnCopy">Copy code</button>
      <button class="mini" id="btnLoad">Load code</button>
      <button class="mini" id="btnFile">Save as file</button>
      <button class="mini" id="btnReset">Reset</button>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:#3070B3"></i>Exercise</span>
      <span><i class="dot" style="background:#B0812A"></i>Bonus / Optional</span>
    </div>
    <div class="hint">
      Click a task = <b>done</b> · <b>✎</b> = toggle <b>note</b> · <b>⊘</b> = <b>skipped</b>.
    </div>
  </header>

  <div class="matrix" id="matrix"></div>

  <footer>54 exercises total · Sheets 0–11</footer>
</div>

<script>
const KEY = "dwt-checkliste-v1";
const SAVED = "";

const BLAETTER = [
 ["0","",[["E","1","Two dice: sum probabilities"],["E","2","Urn with red and blue balls"],["E","3","4-digit PIN"],["E","4","Bug detector (Bayes)"],["E","5","Deck of cards: aces"],["E","6","Multiple-choice paradox"]]],
 ["1","",[["E","1","De Morgan's laws"],["E","2","Preimages under a mapping"],["E","3","Closure properties of σ-algebras"],["E","4","True or false: σ-algebras"],["E","5","Intersection of σ-algebras"],["E","6","Preimage and pushforward of σ-algebras"]]],
 ["2","",[["E","1","True or false: measure theory"],["E","2","Dice roll, rigorously"],["E","3","Inclusion-exclusion formula"],["E","4","Random reshuffling of sheets (Angelika)"],["B","5","Generators of the Borel σ-algebra"]]],
 ["3","",[["E","1","Measurability on generators"],["E","2","Trace σ-algebra"],["E","3","Poisson limit theorem"],["E","4","Marienplatz subway station"]]],
 ["4","",[["E","1","Rolling a tetrahedron"],["E","2","Conditional probability & Bayes"],["E","3","Russian roulette & card trick"],["E","4","Squared uniform random variable"]]],
 ["5","",[["E","1","Value at Risk (VaR)"],["E","2","Memorylessness of the exponential distribution"],["E","3","Conditional density of a joint distribution"]]],
 ["6","",[["E","1","Variance and covariance rules"],["E","2","Mean & variance (Poisson, binomial)"],["E","3","Uncorrelated vs. independent"]]],
 ["7","",[["E","1","Conditional expectation (joint density)"],["E","2","Convolution of densities"],["E","3","Expectation via tail sums"],["E","4","Fish classification (coding)"],["B","5","Inverse transform sampling for a 2D Gaussian"]]],
 ["8","",[["E","1","Sum of independent Poissons"],["E","2","Server overload"],["E","3","Uniform distribution on the disc"],["B","4","Monte Carlo integration (coding)"],["B","5","Properties of the multivariate Gaussian"]]],
 ["9","",[["E","1","Heavy planes (CLT)"],["E","2","Insurance claims and risk"],["E","3","Convergence in probability"],["E","4","Convergence of normal random variables"],["B","5","Properties of the characteristic function"]]],
 ["10","",[["E","1","Sum of waiting times"],["E","2","Quality control in manufacturing"],["E","3","Transformation and convergence in distribution"],["E","4","MLE for the uniform distribution"]]],
 ["11","",[["E","1","Hypothesis test for a mean"],["E","2","Neyman-Pearson test (exponential distribution)"],["E","3","One-sample t-test for a mean"],["E","4","Type II error and power of a z-test"]]]
];

const COLOR = {E:"var(--t)", B:"var(--p)"};
const ALL = [];
BLAETTER.forEach(function(b){ b[2].forEach(function(a){ ALL.push(b[0] + "_" + a[0] + a[1]); }); });

/* d = done · s = skipped · n = note (independent of state) */
let model = {d:{}, s:{}, n:{}};
let open = {};          /* view-only: which note fields are expanded */
let backend = "none";

function b64enc(str){ return btoa(unescape(encodeURIComponent(str))).replace(/=+$/, ""); }
function b64dec(str){ return decodeURIComponent(escape(atob(str))); }

function encode(){ return b64enc(JSON.stringify(model)); }

function decode(code){
  const clean = code.trim().replace(/[^A-Za-z0-9+/=]/g, "");
  const raw = b64dec(clean);
  if(raw.charAt(0) === "{"){
    const o = JSON.parse(raw);
    const m = {d: o.d || {}, s: {}, n: o.n || {}};
    Object.keys(o.s || {}).forEach(function(id){
      m.s[id] = true;
      /* old version: note used to live inside the s-value */
      if(typeof o.s[id] === "string" && o.s[id] && !m.n[id]) m.n[id] = o.s[id];
    });
    return m;
  }
  const bin = atob(clean);
  let bits = "";
  for(let i = 0; i < bin.length; i++) bits += bin.charCodeAt(i).toString(2).padStart(8, "0");
  const d = {};
  ALL.forEach(function(id, i){ if(bits[i] === "1") d[id] = true; });
  return {d:d, s:{}, n:{}};
}

function isEmpty(m){
  return !Object.keys(m.d).length && !Object.keys(m.s).length && !Object.keys(m.n).length;
}

async function save(){
  const code = encode();
  document.getElementById("code").value = code;
  try { history.replaceState(null, "", "#" + code); } catch(e){ try { location.hash = code; } catch(e2){} }
  let ok = false;
  try { if(window.storage){ await window.storage.set(KEY, code); ok = true; backend = "app"; } } catch(e){}
  if(!ok){ try { localStorage.setItem(KEY, code); ok = true; backend = "browser"; } catch(e){} }
  if(!ok) backend = "none";
  showState();
}

async function load(){
  const fromHash = location.hash.slice(1);
  if(fromHash){ try { model = decode(fromHash); backend = "link"; } catch(e){} }
  if(isEmpty(model)){
    try {
      if(window.storage){
        const r = await window.storage.get(KEY);
        if(r && r.value){ model = decode(r.value); backend = "app"; return; }
      }
    } catch(e){}
    try {
      const v = localStorage.getItem(KEY);
      if(v){ model = decode(v); backend = "browser"; return; }
    } catch(e){}
  }
  if(isEmpty(model) && SAVED){ try { model = decode(SAVED); backend = "datei"; } catch(e){} }
  try {
    localStorage.setItem("__probe", "1"); localStorage.removeItem("__probe");
    if(backend === "none" || backend === "datei" || backend === "link") backend = "browser";
  } catch(e){ if(backend !== "app") backend = "none"; }
}

function showState(){
  const el = document.getElementById("state");
  const txt = document.getElementById("stateTxt");
  el.className = "state";
  if(backend === "app" || backend === "browser"){
    el.classList.add("ok"); txt.textContent = "Auto-saved";
  } else {
    el.classList.add("warn"); txt.textContent = "No storage — save file";
  }
}

function render(){
  const root = document.getElementById("matrix");
  root.innerHTML = "";
  BLAETTER.forEach(function(entry){
    const nr = entry[0], datum = entry[1], aufgaben = entry[2];
    const sec = document.createElement("section");
    sec.className = "blatt";
    const head = document.createElement("div");
    head.className = "bhead";
    head.innerHTML = '<span class="bnum">Sheet ' + nr + '</span>' +
                     (datum ? '<span class="bdate">' + datum + '</span>' : '') +
                     '<span class="bcount"></span>';
    sec.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "cells";
    aufgaben.forEach(function(a){
      const typ = a[0], num = a[1], titel = a[2], id = nr + "_" + typ + num;

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.id = id;
      cell.dataset.typ = typ;
      cell.style.setProperty("--type", COLOR[typ]);

      const main = document.createElement("button");
      main.className = "main";
      main.type = "button";
      main.innerHTML = '<span class="box"></span><span class="txt">' +
                       '<span class="code">Exercise ' + num + '</span>' +
                       '<span class="name"></span></span>';
      main.querySelector(".name").textContent = titel;
      main.addEventListener("click", function(){
        if(model.d[id]){ delete model.d[id]; }
        else { model.d[id] = true; delete model.s[id]; }
        paint(); save();
      });

      const tools = document.createElement("div");
      tools.className = "tools";

      const tnote = document.createElement("button");
      tnote.className = "tool tnote";
      tnote.type = "button";
      tnote.textContent = "✎";
      tnote.title = "Note";
      tnote.setAttribute("aria-label", "Note for Sheet " + nr + " Exercise " + num);
      tnote.addEventListener("click", function(){
        open[id] = !open[id];
        paint();
        if(open[id]) cell.querySelector(".note").focus();
      });

      const tskip = document.createElement("button");
      tskip.className = "tool tskip";
      tskip.type = "button";
      tskip.textContent = "⊘";
      tskip.title = "Skipped";
      tskip.setAttribute("aria-label", "Skip Sheet " + nr + " Exercise " + num);
      tskip.addEventListener("click", function(){
        if(model.s[id]){ delete model.s[id]; }
        else { model.s[id] = true; delete model.d[id]; }
        paint(); save();
      });

      tools.appendChild(tnote);
      tools.appendChild(tskip);

      const note = document.createElement("textarea");
      note.className = "note";
      note.rows = 1;
      note.placeholder = "Note …";
      note.setAttribute("aria-label", "Note for Sheet " + nr + " Exercise " + num);
      note.addEventListener("input", function(){
        if(note.value) model.n[id] = note.value; else delete model.n[id];
        markNote(cell, id);
        counters();
      });
      note.addEventListener("change", save);
      note.addEventListener("blur", function(){ open[id] = false; paint(); save(); });

      cell.appendChild(main);
      cell.appendChild(tools);
      cell.appendChild(note);
      grid.appendChild(cell);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });
  paint();
}

function markNote(cell, id){
  cell.classList.toggle("hasnote", !!model.n[id]);
  cell.classList.toggle("noting", !!open[id] || !!model.n[id]);
}

function paint(){
  document.querySelectorAll(".cell").forEach(function(c){
    const id = c.dataset.id;
    const d = !!model.d[id], s = !!model.s[id];
    c.classList.toggle("done", d);
    c.classList.toggle("skipped", s);
    c.querySelector(".main").setAttribute("aria-pressed", d ? "true" : "false");
    c.querySelector(".tskip").setAttribute("aria-pressed", s ? "true" : "false");
    const note = c.querySelector(".note");
    const val = model.n[id] || "";
    if(note.value !== val && document.activeElement !== note) note.value = val;
    markNote(c, id);
  });
  counters();
  document.getElementById("code").value = encode();
}

function counters(){
  const tot = {E:49, B:5};
  const got = {E:0, B:0};
  let doneN = 0, skipped = 0, notes = 0;
  document.querySelectorAll(".cell").forEach(function(c){
    const id = c.dataset.id;
    const d = !!model.d[id], s = !!model.s[id];
    if(d || s) got[c.dataset.typ]++;   /* skipped ones still count */
    if(d) doneN++;
    if(s) skipped++;
    if(model.n[id]) notes++;
  });
  const sum = got.E + got.B;
  document.getElementById("done").textContent = sum;
  document.getElementById("cd").textContent = doneN;
  document.getElementById("fill").style.width = (doneN / 54 * 100) + "%";
  document.getElementById("fillSkip").style.width = (skipped / 54 * 100) + "%";
  document.getElementById("ce").textContent = got.E + "/" + tot.E;
  document.getElementById("cb").textContent = got.B + "/" + tot.B;
  document.getElementById("cs").textContent = skipped;

  document.querySelectorAll(".blatt").forEach(function(sec){
    const cells = sec.querySelectorAll(".cell");
    let n = 0, sk = 0;
    cells.forEach(function(c){
      if(model.d[c.dataset.id]) n++;
      if(model.s[c.dataset.id]) sk++;
    });
    sec.querySelector(".bcount").textContent = (n + sk) + " / " + cells.length + (sk ? "  ⊘ " + sk : "");
    sec.classList.toggle("full", n + sk === cells.length);
  });
}

document.getElementById("btnReset").addEventListener("click", function(){
  model = {d:{}, s:{}, n:{}}; open = {}; paint(); save();
});
document.getElementById("btnCopy").addEventListener("click", function(){
  const inp = document.getElementById("code");
  inp.select();
  try { navigator.clipboard.writeText(inp.value); } catch(e){ try { document.execCommand("copy"); } catch(e2){} }
  const b = document.getElementById("btnCopy");
  b.textContent = "Copied";
  setTimeout(function(){ b.textContent = "Copy code"; }, 1400);
});
document.getElementById("btnLoad").addEventListener("click", function(){
  try { model = decode(document.getElementById("code").value); open = {}; paint(); save(); }
  catch(e){ document.getElementById("stateTxt").textContent = "Code not readable"; }
});
document.getElementById("btnFile").addEventListener("click", function(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector("#matrix").innerHTML = "";
  clone.querySelector("#code").setAttribute("value", "");
  let html = "<!doctype html>\n" + clone.outerHTML;
  html = html.replace(new RegExp('const SAVED = "[^"]*";'), 'const SAVED = "' + encode() + '";');
  const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  const a = document.createElement("a");
  a.href = url; a.download = "dwt-checkliste.html"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  const b = document.getElementById("btnFile");
  b.textContent = "File created";
  setTimeout(function(){ b.textContent = "Save as file"; }, 1800);
});

load().then(function(){ render(); showState(); });
</script>
